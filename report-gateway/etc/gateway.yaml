Name: report-report-gateway
Host: 0.0.0.0
Port: 8888

DevServer:
  Enabled: true

Upstreams:
  - Grpc:
      Target: ${TARGET}:8080
    ProtoSets:
      - etc/report.pb
    Mappings:
      - Method: post
        Path: /init
        RpcPath: report.Report/Init
      - Method: post
        Path: /log_report
        RpcPath: report.Report/LogReport
