syntax = "proto3";
package rcl_interfaces;
option go_package = "./pb";
import "builtin_interfaces.proto";

message Parameter {
	string name = 1;
	ParameterValue value = 2;
}

message GetParameterTypesReq {
	repeated string names = 1;
}

message SetParametersReq {
	repeated Parameter parameters = 1;
}

message DescribeParametersReq {
	repeated string names = 1;
}

message FloatingPointRange {
	double from_value = 1;
	double to_value = 2;
	double step = 3;
}

message ListParametersReq {
	repeated string prefixes = 1;
	uint64 depth = 2;
}

message ListParametersRsp {
	ListParametersResult result = 1;
}

message ListParametersResult {
	repeated string names = 1;
	repeated string prefixes = 2;
}

message SetParametersAtomicallyRsp {
	SetParametersResult result = 1;
}

message SetParametersRsp {
	repeated SetParametersResult results = 1;
}

message ParameterDescriptor {
	string name = 1;
	uint32 type = 2;
	string description = 3;
	string additional_constraints = 4;
	bool read_only = 5;
	bool dynamic_typing = 6;
	repeated FloatingPointRange floating_point_range = 7;
	repeated IntegerRange integer_range = 8;
}

message ParameterValue {
	uint32 type = 1;
	bool bool_value = 2;
	int64 integer_value = 3;
	double double_value = 4;
	string string_value = 5;
	bytes byte_array_value = 6;
	repeated bool bool_array_value = 7;
	repeated int64 integer_array_value = 8;
	repeated double double_array_value = 9;
	repeated string string_array_value = 10;
}

message SetParametersAtomicallyReq {
	repeated Parameter parameters = 1;
}

message SetParametersResult {
	bool successful = 1;
	string reason = 2;
}

message GetParameterTypesRsp {
	repeated uint32 types = 1;
}

message DescribeParametersRsp {
	repeated ParameterDescriptor descriptors = 1;
}

message GetParametersReq {
	repeated string names = 1;
}

message GetParametersRsp {
	repeated ParameterValue values = 1;
}

message IntegerRange {
	int64 from_value = 1;
	int64 to_value = 2;
	uint64 step = 3;
}

message Log {
	builtin_interfaces.Time stamp = 1;
	uint32 level = 2;
	string name = 3;
	string msg = 4;
	string file = 5;
	string function = 6;
	uint32 line = 7;
}

message ParameterEvent {
	builtin_interfaces.Time stamp = 1;
	string node = 2;
	repeated Parameter new_parameters = 3;
	repeated Parameter changed_parameters = 4;
	repeated Parameter deleted_parameters = 5;
}

