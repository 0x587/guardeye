	double linear_velocity_y = 34;
	double linear_velocity_y_uncertainty = 35;
	double linear_velocity_z = 36;
	double linear_velocity_z_uncertainty = 37;
	double angular_velocity_roll = 38;
	double angular_velocity_roll_uncertainty = 39;
	double angular_velocity_pitch = 40;
	double angular_velocity_pitch_uncertainty = 41;
	double angular_velocity_yaw = 42;
	double angular_velocity_yaw_uncertainty = 43;
}

message StartPickAndLoadReq {
	string item_name = 1;
	double item_position_x = 2;
	double item_position_y = 3;
	double load_position_x = 4;
	double load_position_y = 5;
}

message GetStateReq {
}

