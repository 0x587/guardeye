syntax = "proto3";
package shawn_define;
option go_package = "./pb";

message AddReq {
	V2 a = 1;
	V2 b = 2;
	repeated int64 c = 3;
	double d = 4;
	repeated double e = 5;
}

message V2 {
	int64 a = 1;
	int64 b = 2;
}

message AddRsp {
	V2 res = 1;
	repeated int64 c = 2;
	double d = 3;
	repeated double e = 4;
}

