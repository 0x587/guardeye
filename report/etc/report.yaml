Name: report.rpc
ListenOn: 0.0.0.0:8080
Mode: dev

DevServer:
  Enabled: true

#Etcd:
#  Hosts:
#  - ws.scut.mcurobot.com:52379
#  Key: report.rpc

RawLogPusherConf:
  Brokers:
    - ws.scut.mcurobot.com:59094
  Topic: raw_log

WsSubscribePusherConf:
  Brokers:
    - ws.scut.mcurobot.com:59094
  Topic: ws_subscribe

LogSubscribeConsumerConf:
  Name: kqConsumer
  Brokers:
    - ws.scut.mcurobot.com:59094
  Group: logsubscribe
  Topic: raw_log
  Offset: last
  Consumers: 4
  Processors: 4

LogtodbConsumerConf:
  Name: kqConsumer
  Brokers:
    - ws.scut.mcurobot.com:59094
  Group: logtodb
  Topic: raw_log
  Offset: first
  Consumers: 4
  Processors: 4

LogDataKeyConsumerConf:
  Name: kqConsumer
  Brokers:
    - ws.scut.mcurobot.com:59094
  Group: logdatakey
  Topic: raw_log
  Offset: first
  Consumers: 4
  Processors: 4

LogToMetricConsumerConf:
  Name: kqConsumer
  Brokers:
    - ws.scut.mcurobot.com:59094
  Group: logtometric
  Topic: raw_log
  Offset: first
  Consumers: 4
  Processors: 4

ReportRedis:
  Host: ws.scut.mcurobot.com:56379
  Type: node

#PostgresConf: postgres://postgres:example@ws.scut.mcurobot.com:55432/guardeye?sslmode=disable

PostgresConf:
  Driver: postgres
  Dsn: host=ws.scut.mcurobot.com port=55432 user=postgres dbname=guardeye password=example sslmode=disable

MysqlConf:
  Driver: mysql
  Dsn: root:123456@tcp(ws.scut.mcurobot.com:53306)/guardeye