Name: report.rpc
ListenOn: 0.0.0.0:8080
Mode: dev

DevServer:
  Enabled: true

Etcd:
  Hosts:
  - ws.scut.mcurobot.com:52379
  Key: report.rpc

RawLogPusherConf:
  Brokers:
    - ws.scut.mcurobot.com:59094
  Topic: raw_log

