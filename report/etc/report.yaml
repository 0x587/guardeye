  Topic: raw_log
  Offset: first
  Consumers: 2
  Processors: 2

ReportRedis:
  Host: ws.scut.mcurobot.com:56379
  Type: node

MongoConf:
  Uri: mongodb://root:example@ws.scut.mcurobot.com:57017
  Database: guardeye
