syntax = "proto3";
package tutorial_interfaces;
option go_package = "./pb";
import "geometry_msgs.proto";

message Msg1 {
	int64 num = 1;
	geometry_msgs.Point point = 2;
	V3 pos = 3;
	repeated geometry_msgs.Point points = 4;
	repeated V3 poss = 5;
	repeated V3 posss = 6;
}

message V3 {
	float x = 1;
	float y = 2;
	float z = 3;
	geometry_msgs.Point p = 4;
}

